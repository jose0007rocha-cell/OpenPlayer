name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/Android.OpenPlayer.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: Android.OpenPlayer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleGithubRelease

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-release
          path: app/build/outputs/apk/github/release/*.apk

      # Pacote para a Google Play (sabor "play"). Se falhar, o APK acima continua saindo.
      - name: Build Play bundle (AAB)
        continue-on-error: true
        env:
          KEYSTORE_PATH: Android.OpenPlayer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundlePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-play-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: warn
